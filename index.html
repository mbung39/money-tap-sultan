<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💸 MONEY TAP SULTAN 💸</title>
<style>
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
body{background:linear-gradient(135deg, #001a00 0%, #003300 100%); color:white; text-align:center; font-family:Arial; margin:0; padding:15px; overflow-x:hidden;}
h1{color:gold; text-shadow:0 0 10px gold; margin:5px; font-size:20px;}
#koin{font-size:28px; background:#000; padding:10px 20px; border:3px solid gold; border-radius:20px; display:inline-block; margin:10px; color:gold; box-shadow:0 0 20px gold;}
#tap{width:170px; height:170px; background:#000; border-radius:50%; border:7px solid gold; font-size:70px; margin:15px; box-shadow: 0 0 40px gold, inset 0 0 25px rgba(255,215,0,0.3); transition: all 0.2s;}
#tap:active{transform:scale(0.88);} #tap.auto{box-shadow: 0 0 50px lime; border-color:lime;}
.btn-group{display:flex; justify-content:center; gap:10px; margin:10px 0;}
.btn-menu{flex:1; max-width:160px; padding:12px 10px; background:gold; color:#000; border:0; border-radius:12px; font-weight:bold; font-size:14px;}
.btn-batal{background:#555; color:#fff;}
.btn-logout{background:#DB4437; color:#fff;}
.btn-admin{background:#00aa00; color:#fff;}
.popup{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:99; justify-content:center; align-items:center; overflow-y:auto;}
.box{background:#001a00; border:3px solid gold; padding:20px; width:95%; max-width:600px; border-radius:15px; max-height:90vh; overflow-y:auto;}
.item{display:flex; justify-content:space-between; align-items:center; background:#000; padding:12px; margin:8px 0; border-radius:8px; border:1px solid gold; font-size:14px;}
.btn-tukar{background:gold; color:#000; border:0; padding:8px 12px; border-radius:8px; font-weight:bold; font-size:12px;}
.btn-tukar:disabled{background:#333; color:#666;}
.iklan-box{width:100%; max-width:320px; height:100px; background:#000; border:2px dashed gold; border-radius:10px; margin:15px auto 10px; display:flex; justify-content:center; align-items:center; color:gold; font-size:12px;}
.iklan-box2{width:100%; max-width:360px; height:50px; background:#000; border:2px dashed lime; border-radius:10px; margin:10px auto 15px; display:flex; justify-content:center; align-items:center; color:lime; font-size:11px;}
#btnAuto{width:90%; max-width:320px; padding:16px; font-size:17px; font-weight:bold; border:0; border-radius:12px; background:linear-gradient(45deg, #00ff00, #00aa00); color:#000; animation: kedip 1.5s infinite;}
#btnAuto.aktif{background:#002200; color:lime; animation:none; border:2px solid lime; box-shadow:0 0 15px lime;}
#btnLogin, #btnLogin2{background:#4285F4; color:#fff; padding:10px 20px; border:0; border-radius:10px; font-weight:bold; margin:5px; width:200px;}
.money{position:fixed; font-size:26px; animation:muncrat 0.7s ease-out forwards; pointer-events:none; z-index:999;}
@keyframes muncrat{ 0%{opacity:1; transform:scale(0.3) translateY(0) rotate(0deg)} 100%{opacity:0; transform:scale(1.5) translateY(-200px) rotate(720deg)} }
.uang-terbang{position:fixed; font-size:24px; bottom:-60px; pointer-events:none; z-index:1; opacity:0.4;}
@keyframes naikGoyang { 0%{transform:translateY(0) translateX(0) rotate(0deg); opacity:0} 10%{opacity:0.7} 50%{transform:translateY(-400px) translateX(var(--x)) rotate(360deg)} 100%{transform:translateY(-900px) translateX(calc(var(--x) * -1)) rotate(720deg); opacity:0} }
@keyframes kedip{0%,100%{opacity:1;} 50%{opacity:0.7;}}
.admin-wd{border:1px solid lime; background:#000; padding:10px; margin:8px 0; border-radius:8px; text-align:left; font-size:12px;}
.btn-selesai{background:lime; color:#000; border:0; padding:5px 10px; border-radius:5px; font-weight:bold; margin-top:5px;}
</style>
</head>
<body>

<div class="uang-terbang" style="left:5%; --x:50px; animation: naikGoyang 3s linear infinite; animation-delay:0s;">💸</div>
<div class="uang-terbang" style="left:25%; --x:60px; animation: naikGoyang 3.5s linear infinite; animation-delay:0.6s;">🪙</div>
<div class="uang-terbang" style="left:45%; --x:45px; animation: naikGoyang 3.2s linear infinite; animation-delay:1.2s;">💵</div>
<div class="uang-terbang" style="left:65%; --x:35px; animation: naikGoyang 3.8s linear infinite; animation-delay:0.5s;">💸</div>
<div class="uang-terbang" style="left:85%; --x:50px; animation: naikGoyang 3.3s linear infinite; animation-delay:1.1s;">🪙</div>

<button id="btnLogin" onclick="handleLogin()">LOGIN GOOGLE</button><br>
<button id="btnLogin2" onclick="loginRedirect()" style="background:#DB4437; font-size:12px;">LOGIN GOOGLE 2</button>
<div id="userInfo" style="color:gold; font-size:12px; margin-bottom:10px;">Belum Login</div>

<h1>💸 MONEY TAP SULTAN 💸</h1>
<div id="koin">KOIIN: 0,0</div><br>
<button id="tap">💰</button><br>

<div class="btn-group">
  <button class="btn-menu" onclick="show('tukar')">TUKAR SALDO</button>
  <button class="btn-menu" onclick="show('riwayat')">RIWAYAT</button>
</div>
<button class="btn-menu btn-admin" onclick="show('admin')">PANEL ADMIN</button>

<div class="iklan-box">TEMPAT IKLAN 320x100</div>
<button id="btnAuto" onclick="mulaiAuto()">AKTIFKAN AUTO KLIK 1 JAM</button>
<div class="iklan-box2">TEMPAT IKLAN 360x50</div>

<div id="tukar" class="popup" onclick="hide('tukar')"><div class="box" onclick="event.stopPropagation()"><h2>💸 TUKAR SALDO 💸</h2><p style="color:gold; font-size:12px;">Minimal WD: 500.000 Koin</p><div id="listTukar"></div><button class="btn-menu btn-batal" style="max-width:100%; margin-top:10px;" onclick="hide('tukar')">TUTUP</button></div></div>
<div id="riwayat" class="popup" onclick="hide('riwayat')"><div class="box" onclick="event.stopPropagation()"><h2>📜 RIWAYAT WD</h2><div id="list"></div><button class="btn-menu btn-batal" style="max-width:100%;" onclick="hide('riwayat')">TUTUP</button></div></div>
<div id="admin" class="popup" onclick="hide('admin')"><div class="box" onclick="event.stopPropagation()"><h2>👑 PANEL ADMIN WD</h2><div id="listAdmin">Loading...</div><button class="btn-menu btn-batal" style="max-width:100%; margin-top:10px;" onclick="hide('admin')">TUTUP</button></div></div>
<div id="struk" class="popup" onclick="hide('struk')"><div class="box" onclick="event.stopPropagation()"><h2>✅ BERHASIL</h2><div id="isistruk"></div><button class="btn-menu" style="max-width:100%;" onclick="hide('struk')">OK</button></div></div>
<div id="konfirmasiLogout" class="popup" onclick="hide('konfirmasiLogout')"><div class="box" onclick="event.stopPropagation()"><h2>⚠️ YAKIN LOGOUT?</h2><p>Data koin aman tersimpan di cloud kok bree</p><div class="btn-group"><button class="btn-menu btn-batal" onclick="hide('konfirmasiLogout')">BATAL</button><button class="btn-menu btn-logout" onclick="prosesLogout()">LOGOUT</button></div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC0nYhsMgueVA_91JWw-m8pXWRIZiizzG4",
  authDomain: "tapkoin-sultan.firebaseapp.com",
  projectId: "tapkoin-sultan",
  storageBucket: "tapkoin-sultan.firebasestorage.app",
  messagingSenderId: "520240440983",
  appId: "1:520240440983:web:92549e6ee3beb156bcebd2"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

var koin = 0;
var hist = [];
var autoSelesai = 0;
var userId = null;
var autoInterval = null;
var ADMIN_EMAIL = "didin39scakep39@gmail.com"; // GANTI INI DENGAN EMAIL GOOGLE LU BREE

// TAMBAHAN 1: BUAT FONNTE
var FONNTE_TOKEN = ""; // AMBIL DARI md.fonnte.com
var ADMIN_WA = "6285143890586"; // NOMER WA LU PAKE 62

function formatKoin(angka){ return angka.toLocaleString('id-ID', {minimumFractionDigits: 1, maximumFractionDigits: 1}); }

auth.getRedirectResult().then((result) => { if (result.user) { location.reload(); } }).catch(function(error) {});

auth.onAuthStateChanged(user => {
  if(user){
    userId = user.uid;
    document.getElementById('btnLogin').innerText = 'LOGOUT';
    document.getElementById('btnLogin2').style.display = 'none';
    document.getElementById('userInfo').innerText = 'Halo, ' + user.displayName;
    if(user.email == ADMIN_EMAIL){ document.querySelector('.btn-admin').style.display = 'inline-block'; } else { document.querySelector('.btn-admin').style.display = 'none'; }
    loadData();
  }else{
    userId = null;
    document.getElementById('btnLogin').innerText = 'LOGIN GOOGLE';
    document.getElementById('btnLogin2').style.display = 'inline-block';
    document.getElementById('userInfo').innerText = 'Belum Login';
    koin = 0; hist = []; autoSelesai = 0;
    updateUI();
  }
});

function handleLogin(){ if(userId){ show('konfirmasiLogout'); } else { loginPopup(); } }
function loginPopup(){ var provider = new firebase.auth.GoogleAuthProvider(); auth.signInWithPopup(provider).catch(function(error) { alert("Popup gagal. Coba tombol LOGIN GOOGLE 2"); }); }
function loginRedirect(){ var provider = new firebase.auth.GoogleAuthProvider(); auth.signInWithRedirect(provider); }
function prosesLogout(){ hide('konfirmasiLogout'); auth.signOut(); }

function loadData(){
  db.collection("users").doc(userId).get().then(doc => {
    if(doc.exists){
      koin = doc.data().koin || 0;
      hist = doc.data().hist || [];
      autoSelesai = doc.data().autoSelesai || 0;
      var sekarang = Date.now();
      if(autoSelesai > sekarang){
        var sisaDetik = Math.floor((autoSelesai - sekarang) / 1000);
        mulaiAuto(true, sisaDetik);
      }
    }
    updateUI();
  });
}

function saveData(){
  if(!userId) return;
  db.collection("users").doc(userId).set({koin: koin, hist: hist, autoSelesai: autoSelesai});
}

function updateUI(){ document.getElementById('koin').innerText = 'KOIIN: ' + formatKoin(koin); }

document.getElementById('tap').onclick = () => { tambahKoinManual(); muncratAcak(); }

function tambahKoinManual(){ koin = Math.round((koin + 0.1)*10)/10; saveData(); updateUI(); }
function tambahKoinAuto(){ koin = koin + 1; saveData(); updateUI(); }

function muncratAcak(){
  var btn = document.getElementById('tap'); var rect = btn.getBoundingClientRect(); var cx = rect.left + rect.width/2; var cy = rect.top + rect.height/2;
  for(var i=0; i<10; i++){
    var sudut = Math.random() * 360; var jarak = 30 + Math.random() * 100; var x = cx + jarak * Math.cos(sudut * Math.PI / 180); var y = cy + jarak * Math.sin(sudut * Math.PI / 180);
    var m = document.createElement('div'); m.className='money'; m.innerHTML = ['💵','🪙','💸','💰'][Math.floor(Math.random()*4)];
    m.style.left = x + 'px'; m.style.top = y + 'px'; m.style.animationDelay = i*0.03 + 's'; m.style.fontSize = (18 + Math.random()*20) + 'px';
    document.body.appendChild(m); setTimeout(function(el){el.remove()},700, m);
  }
}

function mulaiAuto(load, sisa){
  if(!userId){ alert('Login dulu bree!'); return; }
  if(autoInterval) return;
  if(!load){
    autoSelesai = Date.now() + (3600 * 1000);
    saveData();
  }
  document.getElementById('tap').className = 'auto';
  autoInterval = setInterval(function(){
    tambahKoinAuto(); muncratAcak();
    var sekarang = Date.now();
    var sisaMs = autoSelesai - sekarang;
    if(sisaMs <= 0){
      clearInterval(autoInterval); autoInterval = null; autoSelesai = 0; saveData();
      document.getElementById('btnAuto').innerText = 'AKTIFKAN AUTO KLIK 1 JAM';
      document.getElementById('btnAuto').className = '';
      document.getElementById('btnAuto').disabled = false;
      document.getElementById('tap').className = '';
      return;
    }
    var sisaDetik = Math.floor(sisaMs / 1000);
    var jam = Math.floor(sisaDetik/3600); var menit = Math.floor((sisaDetik%3600)/60); var detik = sisaDetik%60;
    document.getElementById('btnAuto').innerText = '⏰ ' + jam + 'j ' + menit + 'm ' + detik + 'd';
    document.getElementById('btnAuto').className = 'aktif'; document.getElementById('btnAuto').disabled = true;
  }, 1000);
}

function show(id){
  if(id=='tukar'){
    var list = '';
    var paket = [
      {nama: 'DANA/GOPAY 5.000', koin: 500},
      {nama: 'DANA/GOPAY 10.000', koin: 1000000},
      {nama: 'DANA/GOPAY 20.000', koin: 2000000}
    ];
    paket.forEach(p => {
      var disable = koin < p.koin? 'disabled' : '';
      list += `<div class="item">${p.nama} <small>${formatKoin(p.koin)} koin</small> <button class="btn-tukar" ${disable} onclick="tukar('${p.nama}',${p.koin})">TUKAR</button></div>`;
    });
    document.getElementById('listTukar').innerHTML = list;
  }
  if(id=='riwayat'){
    var s=''; if(hist.length==0){s='Belum ada riwayat'}
    hist.forEach(h => { s+=`<div style="border-bottom:1px solid gold; padding:8px; text-align:left;"><b>${h.menu}</b><br><small>${h.tgl}</small><br><small>No: ${h.ewallet}</small><br><small>Status: ${h.status}</small></div>` })
    document.getElementById('list').innerHTML=s;
  }
  if(id=='admin'){ loadAdminPanel(); }
  document.getElementById(id).style.display='flex';
}
function hide(id){document.getElementById(id).style.display='none';}

// TAMBAHAN 2: FUNGSI KIRIM WA
function kirimWAFonnte(pesan){
  fetch("/api/kirim.js", { // INI YG DIGANTI. DULU LANGSUNG KE FONNTE
    "method": "POST",
    "headers": { "Content-Type": "application/json" },
    "body": JSON.stringify({ 
      target: ADMIN_WA,
      message: pesan
    })
  }).then(res => res.json()).then(data => { 
    console.log("WA Terkirim:", data); 
  }).catch(err => { 
    console.log("Gagal kirim WA:", err);
  });
}

function tukar(menu,harga){
  if(!userId){ alert('Login dulu bree!'); return; }
  if(koin<harga){alert('Koin kurang! Butuh '+formatKoin(harga)) ;return;}
  var nama=prompt('Nama Penerima DANA/GOPAY:'); if(!nama)return;
  var no=prompt('No DANA/GOPAY:'); if(!no)return;
  var user = auth.currentUser;
  koin=koin-harga;
  var tgl = new Date().toLocaleString('id');
  hist.unshift({
    menu:menu, tgl:tgl, ewallet:no, namaPenerima:nama,
    namaAkun:user.displayName, email:user.email, uid:user.uid, status:"Menunggu"
  });
  saveData(); updateUI();

  // TAMBAHAN 3: PANGGIL FONNTE DISINI
  var pesanWA = `🚨 ADA WD BARU 🚨\n\nNama: ${user.displayName}\nEmail: ${user.email}\nTarik: ${menu}\nNama DANA: ${nama}\nNo: ${no}\nTgl: ${tgl}`;
  kirimWAFonnte(pesanWA);

  document.getElementById('isistruk').innerHTML=`<b>Tarik:</b> ${menu}<br><b>Nama:</b> ${nama}<br><b>No:</b> ${no}<br><b>Sisa:</b> ${formatKoin(koin)}<br><hr>Tunggu 1x24 Jam`;
  hide('tukar'); show('struk');
}

function loadAdminPanel(){
  var s = 'Loading data WD...';
  document.getElementById('listAdmin').innerHTML = s;
  db.collection("users").get().then(snapshot => {
    s = '';
    snapshot.forEach(doc => {
      var data = doc.data();
      if(data.hist){
        data.hist.forEach((h, i) => {
          if(h.status == "Menunggu"){
            s += `<div class="admin-wd">
              <b>${h.menu}</b><br>
              Nama Akun: ${h.namaAkun}<br>
              Email: ${h.email}<br>
              Nama DANA: ${h.namaPenerima}<br>
              No: ${h.ewallet}<br>
              Tgl: ${h.tgl}<br>
              <button class="btn-selesai" onclick="selesaiWD('${doc.id}', ${i})">SUDAH TRANSFER</button>
            </div>`;
          }
        });
      }
    });
    if(s=='') s = 'Belum ada permintaan WD';
    document.getElementById('listAdmin').innerHTML = s;
  });
}

function selesaiWD(uid, index){
  if(!confirm('Yakin sudah transfer?')) return;
  db.collection("users").doc(uid).get().then(doc => {
    var data = doc.data();
    data.hist[index].status = "Selesai";
    db.collection("users").doc(uid).set(data).then(() => {
      alert('Status diubah jadi Selesai');
      loadAdminPanel();
    });
  });
}
</script>
</body>
</html>
