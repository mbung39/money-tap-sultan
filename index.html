<style>
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
body{background:linear-gradient(135deg, #001a00 0%, #003300 100%); color:white; text-align:center; font-family:Arial; margin:0; padding:15px; overflow-x:hidden;}
h1{color:gold; text-shadow:0 0 10px gold; margin:5px; font-size:20px;}
#koin{font-size:28px; background:#000; padding:10px 20px; border:3px solid gold; border-radius:20px; display:inline-block; margin:10px; color:gold; box-shadow:0 0 20px gold;}
#tap{width:170px; height:170px; background:#000; border-radius:50%; border:7px solid gold; font-size:70px; margin:15px; box-shadow: 0 0 40px gold, inset 0 0 25px rgba(255,215,0,0.3); transition: all 0.2s;}

.box{background:#001a00; border:3px solid gold; padding:20px; width:95%; max-width:600px; border-radius:15px; max-height:90vh; overflow-y:auto;}
.item{display:flex; justify-content:space-between; align-items:center; background:#000; padding:12px; margin:8px 0; border-radius:8px; border:1px solid gold; font-size:14px;}

.iklan-box{width:100%; max-width:320px; min-height:100px; background:#000; border:2px dashed gold; border-radius:10px; margin:15px auto 10px; display:flex; justify-content:center; align-items:center; overflow:hidden;}
.iklan-box2{width:100%; max-width:360px; min-height:50px; background:#000; border:2px dashed lime; border-radius:10px; margin:10px auto 15px; display:flex; justify-content:center; align-items:center; overflow:hidden;}
#btnAuto{width:90%; max-width:320px; padding:16px; font-size:17px; font-weight:bold; border:0; border-radius:12px; background:linear-gradient(45deg, #00ff00, #00aa00); color:#000; animation: kedip 1.5s infinite;}
#btnAuto.aktif{background:#002200; color:lime; animation:none; border:2px solid lime; box-shadow:0 0 15px lime;}
#btnIklan{width:90%; max-width:320px; padding:14px; font-size:15px; font-weight:bold; border:0; border-radius:12px; background:linear-gradient(45deg, #ff9900, #ff5500); color:#fff; margin-bottom:10px; box-shadow:0 0 15px orange;}
#btnLogin, #btnLogin2{background:#4285F4; color:#fff; padding:10px 20px; border:0; border-radius:10px; font-weight:bold; margin:5px; width:200px;}
.money{position:fixed; font-size:26px; animation:muncrat 0.7s ease-out forwards; pointer-events:none; z-index:999;}
@keyframes muncrat{ 0%{opacity:1; transform:scale(0.3) translateY(0) rotate(0deg)} 100%{opacity:0; transform:scale(1.5) translateY(-200px) rotate(720deg)} }
@keyframes kedip{0%,100%{opacity:1;} 50%{opacity:0.7;}}

}

<h1>💸 MONEY TAP SULTAN 💸</h1>

<div id="tukar" class="popup" onclick="hide('tukar')"><div class="box" onclick="event.stopPropagation()"><h2>💸 TUKAR SALDO 💸</h2><p style="color:gold; font-size:12px;">Minimal WD: 500.000 Koin</p><div id="listTukar"></div><button class="btn-menu btn-batal" style="max-width:100%; margin-top:10px;" onclick="hide('tukar')">TUTUP</button></div></div>

<div id="struk" class="popup" onclick="hide('struk')"><div class="box" onclick="event.stopPropagation()"><h2>✅ BERHASIL</h2><div id="isistruk"></div><button class="btn-menu" style="max-width:100%;" onclick="hide('struk')">OK</button></div></div>
<div id="konfirmasiLogout" class="popup" onclick="hide('konfirmasiLogout')"><div class="box" onclick="event.stopPropagation()"><h2>⚠️ YAKIN LOGOUT?</h2><p>Data koin aman tersimpan di cloud kok bree</p><div class="btn-group"><button class="btn-menu btn-batal" onclick="hide('konfirmasiLogout')">BATAL</button><button class="btn-menu btn-logout" onclick="prosesLogout()">LOGOUT</button></div></div></div>

  <div class="iklan-content" onclick="event.stopPropagation()">
    <button class="btn-close-x" onclick="hide('popupIklan')">X</button>
    <h2 class="judul-iklan">KAMU TAHU?</h2>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = { apiKey: "AIzaSyC0nYhsMgueVA_91JWw-m8pXWRIZiizzG4", authDomain: "tapkoin-sultan.firebaseapp.com", projectId: "tapkoin-sultan", storageBucket: "tapkoin-sultan.firebasestorage.app", messagingSenderId: "520240440983", appId: "1:520240440983:web:92549e6ee3beb156bcebd2" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(); const db = firebase.firestore();
var koin=0,hist=[],autoSelesai=0,userId=null,autoInterval=null,timerIklanInterval=null;
var ADMIN_EMAIL="didin39scakep39@gmail.com";
function formatKoin(a){return a.toLocaleString('id-ID',{minimumFractionDigits: 1, maximumFractionDigits: 1});}
auth.getRedirectResult().then(r=>{if(r.user) location.reload();});
auth.onAuthStateChanged(user=>{
  if(user){userId=user.uid; document.getElementById('btnLogin').innerText='LOGOUT'; document.getElementById('btnLogin2').style.display='none'; document.getElementById('userInfo').innerText='Halo, '+user.displayName; if(user.email==ADMIN_EMAIL){document.getElementById('btnAdmin').style.setProperty('display','inline-block','important');}else{document.getElementById('btnAdmin').style.display='none';} loadData();}
  else{userId=null; document.getElementById('btnLogin').innerText='LOGIN GOOGLE'; document.getElementById('btnLogin2').style.display='inline-block'; document.getElementById('userInfo').innerText='Belum Login'; document.getElementById('btnAdmin').style.display='none'; koin=0; hist=[]; autoSelesai=0; updateUI();}
});
function handleLogin(){if(userId){show('konfirmasiLogout');}else{loginPopup();}}
function loginPopup(){var p=new firebase.auth.GoogleAuthProvider(); auth.signInWithPopup(p).catch(e=>{alert("Popup gagal. Coba tombol 2");});}
function loginRedirect(){var p=new firebase.auth.GoogleAuthProvider(); auth.signInWithRedirect(p);}
function prosesLogout(){hide('konfirmasiLogout'); auth.signOut();}
function loadData(){db.collection("users").doc(userId).get().then(doc=>{if(doc.exists){koin=doc.data().koin||0; hist=doc.data().hist||[]; autoSelesai=doc.data().autoSelesai||0; var last=doc.data().lastSave||0; var now=Date.now(); if(autoSelesai>now){if(last>0){var off=Math.floor((now-last)/1000); var sisa=Math.floor((autoSelesai-last)/1000); if(off>sisa) off=sisa; koin=koin+off;} var s=Math.floor((autoSelesai-now)/1000); mulaiAuto(true,s);}} updateUI();});}
function saveData(){if(!userId) return; db.collection("users").doc(userId).set({koin:koin,hist:hist,autoSelesai:autoSelesai,lastSave:Date.now()});}
function updateUI(){document.getElementById('koin').innerText='KOIIN: '+formatKoin(koin);}
document.getElementById('tap').onclick=()=>{tambahKoinManual(); muncratAcak();}
function tambahKoinManual(){koin=Math.round((koin+0.1)*10)/10; saveData(); updateUI();}
function tambahKoinAuto(){koin=koin+1; saveData(); updateUI();}
function muncratAcak(){var btn=document.getElementById('tap'); var r=btn.getBoundingClientRect(); var cx=r.left+r.width/2,cy=r.top+r.height/2; for(var i=0;i<10;i++){var s=Math.random()*360,j=30+Math.random()*100,x=cx+j*Math.cos(s*Math.PI/180),y=cy+j*Math.sin(s*Math.PI/180); var m=document.createElement('div'); m.className='money'; m.innerHTML=['💵','🪙','💸','💰'][Math.floor(Math.random()*4)]; m.style.left=x+'px'; m.style.top=y+'px'; m.style.animationDelay=i*0.03+'s'; m.style.fontSize=(18+Math.random()*20)+'px'; document.body.appendChild(m); setTimeout(function(e){e.remove()},700,m);}}
function bukaIklan(){
  if(!userId){alert('Login dulu bree!'); return;}
  document.getElementById('frameIklan').src='https://omg10.com/4/11813928';
  document.getElementById('btnKlaimIklan').style.display='none';
  document.getElementById('popupIklan').style.display='flex';
  var detik=10;
  document.getElementById('timerIklan').innerText='Tunggu '+detik+'s untuk klaim...';
  if(timerIklanInterval) clearInterval(timerIklanInterval);
  timerIklanInterval=setInterval(function(){
    detik--;
    if(detik>0){document.getElementById('timerIklan').innerText='Tunggu '+detik+'s untuk klaim... Trivia '+(10-detik)+'/10';}
    else{clearInterval(timerIklanInterval); document.getElementById('timerIklan').innerText='Selesai! Klaim hadiahmu'; document.getElementById('btnKlaimIklan').style.display='inline-block';}
  },1000);
}
function klaimIklan(){koin=koin+1000; saveData(); updateUI(); hide('popupIklan'); document.getElementById('frameIklan').src=''; alert('Mantap bree! +1000 koin masuk 💰'); muncratAcak(); muncratAcak();}
function mulaiAuto(load,sisa){
  if(!userId){alert('Login dulu bree!'); return;} if(autoInterval) return;
  if(!load){autoSelesai=Date.now()+(3600*1000); saveData();}
  document.getElementById('tap').className='auto';
  autoInterval=setInterval(function(){
    tambahKoinAuto(); muncratAcak();
    var now=Date.now(); var ms=autoSelesai-now;
    if(ms<=0){clearInterval(autoInterval); autoInterval=null; autoSelesai=0; saveData(); document.getElementById('btnAuto').innerText='AKTIFKAN AUTO KLIK 1 JAM'; document.getElementById('btnAuto').className=''; document.getElementById('btnAuto').disabled=false; document.getElementById('tap').className=''; return;}
    var sd=Math.floor(ms/1000); var j=Math.floor(sd/3600), m=Math.floor((sd%3600)/60), d=sd%60;
    document.getElementById('btnAuto').innerText='⏰ '+j+'j '+m+'m '+d+'d'; document.getElementById('btnAuto').className='aktif'; document.getElementById('btnAuto').disabled=true;
  },1000);
}
function show(id){
  if(id=='tukar'){var list='',paket=[{nama:'DANA 5.000',koin:500000},{nama:'GOPAY 10.000',koin:1000000},{nama:'DANA 20.000',koin:2000000}]; paket.forEach(p=>{var dis=koin<p.koin?'disabled':''; list+=`<div class="item">${p.nama} <small>${formatKoin(p.koin)} koin</small> <button class="btn-tukar" ${dis} onclick="tukar('${p.nama}',${p.koin})">TUKAR</button></div>`;}); document.getElementById('listTukar').innerHTML=list;}
  if(id=='riwayat'){var s=''; if(hist.length==0){s='Belum ada riwayat'} hist.forEach(h=>{s+=`<div style="border-bottom:1px solid gold; padding:8px; text-align:left;"><b>${h.menu}</b><br><small>${h.tgl}</small><br><small>No: ${h.ewallet}</small><br><small>Status: ${h.status}</small></div>`}); document.getElementById('list').innerHTML=s;}
  if(id=='admin'){loadAdminPanel();}
  document.getElementById(id).style.display='flex';
}
function hide(id){document.getElementById(id).style.display='none'; if(id=='popupIklan'){document.getElementById('frameIklan').src=''; if(timerIklanInterval) clearInterval(timerIklanInterval);}}
function tukar(menu,harga){
  if(!userId){alert('Login dulu bree!'); return;} if(koin<harga){alert('Koin kurang! Butuh '+formatKoin(harga));return;}
  var nama=prompt('Nama Penerima DANA/GOPAY:'); if(!nama)return; var no=prompt('No DANA/GOPAY:'); if(!no)return; var user=auth.currentUser; koin=koin-harga; var tgl=new Date().toLocaleString('id');
  hist.unshift({menu:menu,tgl:tgl,ewallet:no,namaPenerima:nama,namaAkun:user.displayName,email:user.email,uid:user.uid,status:"Menunggu"}); saveData(); updateUI();
  document.getElementById('isistruk').innerHTML=`<b>Tarik:</b> ${menu}<br><b>Nama:</b> ${nama}<br><b>No:</b> ${no}<br><b>Sisa:</b> ${formatKoin(koin)}<br><hr>Tunggu 1x24 Jam`; hide('tukar'); show('struk');
}
function loadAdminPanel(){
  var s='Loading data WD...'; document.getElementById('listAdmin').innerHTML=s;
  db.collection("users").get().then(snapshot=>{s=''; snapshot.forEach(doc=>{var data=doc.data(); if(data.hist){data.hist.forEach((h,i)=>{if(h.status=="Menunggu"){s+=`<div class="admin-wd"><b>${h.menu}</b><br>Nama Akun: ${h.namaAkun}<br>Email: ${h.email}<br>Nama DANA: ${h.namaPenerima}<br>No: ${h.ewallet}<br>Tgl: ${h.tgl}<br><button class="btn-selesai" onclick="selesaiWD('${doc.id}', ${i})">SUDAH TRANSFER</button></div>`;}});}); if(s=='') s='Belum ada permintaan WD'; document.getElementById('listAdmin').innerHTML=s;});
}
function selesaiWD(uid,index){if(!confirm('Yakin sudah transfer?')) return; db.collection("users").doc(uid).get().then(doc=>{var data=doc.data(); data.hist[index].status="Selesai"; db.collection("users").doc(uid).set(data).then(()=>{alert('Status diubah jadi Selesai'); loadAdminPanel();});});}
</script>
